name: Product API - Basic CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run API and CRUD integration tests
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: npm start > /tmp/product-api.log 2>&1 &
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/product-api.log
          exit 1
      - run: npm test
        env:
          API_URL: http://127.0.0.1:3000
